<text x="100" y="380" font-size="11" font-weight="bold" fill="#15803d">Regime 1: Logic-Dominated (256k–512k)</text>
<text x="100" y="397" font-size="10" fill="#166534">Δt ≈ +67 ps/doubling (~2–3 FO4 gates)</text>
<text x="100" y="412" font-size="10" fill="#166534">Amrutur &amp; Horowitz scaling visible here!</text>
<rect x="375.0" y="95" width="290" height="85" fill="#fef2f2" stroke="#fca5a5" rx="4" opacity="0.95"/>
<text x="385.0" y="115" font-size="11" font-weight="bold" fill="#b91c1c">Regime 2: Interconnect-Dominated (1M–16M)</text>
<text x="385.0" y="132" font-size="10" fill="#991b1b">Global H-tree wire delay explodes (L ∝ √Area)</text>
<text x="385.0" y="147" font-size="10" fill="#991b1b">Δt rises from +149 ps up to +1890 ps/doubling!</text>
<text x="385.0" y="162" font-size="10" fill="#991b1b">Shatters pure linear gate-delay model.</text>
